
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delight POP</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">


<style>
/* ========================================
   기본 설정
======================================== */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  background: #dce8f5;
  font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

/* ========================================
   전체 POP 화면
======================================== */

.app {
  position: relative;
  display: flex;
  flex-direction: column;

  width: 100%;
  max-width: 560px;
  height: 100vh;
  height: 100dvh;

  margin: 0 auto;
  overflow: hidden;

  background:
    #83acd9
    url("background.jpg")
    center / cover no-repeat;
}

/* ========================================
   상단 헤더
======================================== */

.header {
  position: relative;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;

  height: 58px;
  padding: 0 12px;

  color: #fff;
  background: rgba(60, 100, 155, 0.10);
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
}

.header-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  text-align: center;
  white-space: nowrap;
  pointer-events: none;
}

/* 상단 Delight 이름 */

.header-title {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.25;
}

/* 함께한 지 N일 */

.header-days {
  margin-top: 3px;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.25;
}

.header-actions {
  display: flex;
  margin-left: auto;
}

/* 헤더 아이콘 */

.icon-btn {
  display: grid;
  place-items: center;

  width: 35px;
  height: 40px;
  padding: 6px;

  border: 0;
  background: transparent;
  color: #fff;
}

.icon-btn svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.85;
  stroke-linecap: round;
  stroke-linejoin: round;
}


/* ========================================
   채팅 스크롤 영역
======================================== */

.chat {
  flex: 1;
  min-height: 0;

  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;

  padding:
    18px 14px
    calc(40px + env(safe-area-inset-bottom));

  scrollbar-width: thin;
}

/* ========================================
   닉네임 환영 안내
======================================== */

.notice {
  margin: 7px 0 30px;
  padding: 14px 16px;

  border-radius: 16px;
  background: rgba(44, 74, 113, 0.39);

  color: #fff;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.6;

  word-break: keep-all;
}

.notice strong {
  display: block;

  margin-bottom: 4px;

  font-size: 14px;
  font-weight: 600;
}

/* ========================================
   날짜 구분
======================================== */

.day-label {
  display: table;

  max-width: 100%;
  margin: 16px auto 32px;
  padding: 7px 15px;

  border-radius: 30px;
  background: rgba(66, 97, 132, 0.45);

  color: #fff;
  font-size: 12px;
  font-weight: 400;
  text-align: center;
}

/* ========================================
   프로필 / 메시지 공통
======================================== */

.message {
  display: flex;
  align-items: flex-start;

  gap: 9px;
  margin-bottom: 23px;
}

/* 프로필 사진 */

.profile {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;

  border-radius: 50%;
  object-fit: cover;
}

.message-content {
  flex: 1;
  min-width: 0;
}

/* 이름, 인증 배지, 시간 */

.meta {
  display: flex;
  align-items: center;

  min-height: 20px;
  margin: 1px 0 8px;

  white-space: nowrap;
}

/* 채팅 Delight 이름 */

.sender {
  color: #fff;
  font-size: 14px;
  font-weight: 400;
  line-height: 20px;
}

/* 인증 배지 */

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 17px;
  height: 17px;
  flex-shrink: 0;

  margin-left: 3px;
}

.badge svg {
  display: block;
  width: 17px;
  height: 17px;
}

/* 메시지 시간 */

.time {
  margin-left: 7px;

  color: rgba(255, 255, 255, 0.92);
  font-size: 11px;
  font-weight: 400;
  line-height: 20px;
}

/* ========================================
   일반 메시지 말풍선
======================================== */

.bubble {
  display: table;

  width: fit-content;
  max-width: 100%;

  margin: 0 0 8px;
  padding: 11px 14px;

  border-radius: 22px;
  background: #fff;
  color: #171717;

  font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: -0.25px;
  line-height: 1.5;

  word-break: keep-all;
  overflow-wrap: break-word;
}

/* 원문 띄어쓰기와 엔터 유지 */

.original {
  display: block;

  white-space: pre-wrap;
  word-break: keep-all;
  overflow-wrap: break-word;
}

/* ========================================
   번역문
======================================== */

.translation {
  display: none;

  margin-top: 7px;
  padding-top: 7px;

  border-top: 1px dashed #dce1e8;

  color: #8798b0;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;

  white-space: pre-wrap;
  word-break: keep-all;
  overflow-wrap: break-word;
}

.translation.show {
  display: block;
}

/* ========================================
   답장 말풍선

   원본처럼 가로로 넉넉하게
   모서리는 둥글게
   높이와 글씨는 과하게 크지 않게
======================================== */

.reply {
  display: table;

  width: fit-content;
  max-width: 100%;

  margin: 0 0 8px;
  padding: 12px 15px 13px;

  border: 0;
  border-radius: 25px;

  background: #fff;
  color: #171717;

  font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;

  word-break: keep-all;
  overflow-wrap: break-word;
}

/* Delight님의 답장 */

.reply-heading {
  margin: 0;
  padding: 0;

  border: 0;

  color: #343434;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
}

/* 답장 인용문 */


.reply-quote {
  margin-top: 4px;
  color: #a0a0a0;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.45;

  white-space: pre-wrap;
  word-break: break-all;
  overflow-wrap: anywhere;
}


/* 답장 내용 + 화살표 */

.reply-main {
  display: flex;
  align-items: flex-start;

  gap: 8px;
  margin-top: 10px;
}

/* 답장 화살표 */

.reply-arrow {
  display: block;

  width: 20px;
  height: 20px;
  flex: 0 0 20px;
}

.reply-arrow svg {
  display: block;

  width: 20px;
  height: 20px;
}

/* 답장 내용 영역 */

.reply-answer-content {
  min-width: 0;
}

/* 실제 답변 글씨 */

.reply-answer {
  color: #171717;

  font-size: 14px;
  font-weight: 400;
  letter-spacing: -0.25px;
  line-height: 1.45;

  white-space: pre-wrap;
  word-break: keep-all;
  overflow-wrap: break-word;
}

/* 답장 안 번역 */

.reply .translation {
  margin-top: 6px;
  padding-top: 0;
  border-top: 0;
}

/* ========================================
   채팅 사진
======================================== */

.message-photo {
  display: block;

  width: auto;
  max-width: min(100%, 320px);
  max-height: 450px;

  margin: 0 0 8px;

  border-radius: 17px;
  object-fit: contain;

  cursor: pointer;
}

/* ========================================
   언어 선택 메뉴
======================================== */

.lang-menu,
.calendar {
  display: none;

  position: absolute;
  z-index: 30;

  background: #fff;
  border-radius: 16px;

  box-shadow: 0 8px 27px rgba(0, 0, 0, 0.2);
}

.lang-menu.open,
.calendar.open {
  display: block;
}

.lang-menu {
  top: 57px;
  right: 45px;

  width: 180px;
  padding: 5px 0;
}

.lang-menu button {
  display: block;

  width: 100%;
  padding: 12px 15px;

  border: 0;
  background: transparent;

  color: #222;
  font-size: 13px;
  text-align: left;
}

.lang-menu button.active {
  color: #587fe0;
  font-weight: 600;
}

/* ========================================
   달력
======================================== */

.calendar {
  top: 62px;
  right: 9px;

  width: min(330px, calc(100% - 18px));
  padding: 16px;
}

.calendar-head {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 12px;
}

.calendar-head button {
  border: 0;
  background: transparent;

  font-size: 23px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);

  gap: 6px 0;
  text-align: center;
}

.weekday {
  padding: 8px 0;

  color: #9fa6b5;
  font-size: 12px;
}

.day {
  position: relative;

  width: 36px;
  height: 38px;
  max-width: 100%;

  margin: auto;

  border: 0;
  border-radius: 50%;
  background: transparent;

  color: #9da4b1;
  font-size: 13px;
}

.day.has {
  background: #dfe8f8;
  color: #222;
  font-weight: 600;
}

.day.has::after {
  content: "";

  position: absolute;
  bottom: 2px;
  left: calc(50% - 2px);

  width: 4px;
  height: 4px;

  border-radius: 50%;
  background: #af9569;
}

/* 공통 버튼 */

.primary {
  width: 100%;
  margin-top: 15px;
  padding: 12px;

  border: 0;
  border-radius: 11px;

  background: #292929;
  color: #fff;

  font-size: 13px;
}

/* ========================================
   설정창 배경
======================================== */

.overlay {
  display: none;

  position: fixed;
  inset: 0;
  z-index: 50;

  background: rgba(0, 0, 0, 0.47);
}

.overlay.open {
  display: block;
}

/* 설정창 */

.sheet {
  position: absolute;
  bottom: 0;
  left: 50%;

  transform: translateX(-50%);

  width: 100%;
  max-width: 560px;
  max-height: 89dvh;

  overflow-y: auto;

  padding:
    12px 18px
    calc(30px + env(safe-area-inset-bottom));

  border-radius: 24px 24px 0 0;

  background: #fff;
  color: #222;
}

/* 상단 손잡이 */

.handle {
  width: 40px;
  height: 4px;

  margin: 0 auto 20px;

  border-radius: 10px;
  background: #e8e2d8;
}

/* 설정 제목 */

.sheet-title {
  margin-bottom: 24px;

  font-size: 16px;
  font-weight: 600;
  text-align: center;
}

/* 닫기 버튼 */

.close {
  position: absolute;
  top: 13px;
  right: 17px;

  width: 38px;
  height: 38px;

  border: 0;
  border-radius: 50%;

  background: #f2f2f2;
  color: #222;

  font-size: 23px;
}

/* ========================================
   사진 모아보기
======================================== */

.media-head {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 12px;

  color: #888;
  font-size: 13px;
}

.media-head button {
  border: 0;
  background: transparent;

  color: #57866c;
  font-size: 12px;
}

/* 최근 사진 4장 */

.preview {
  display: grid;
  grid-template-columns: repeat(4, 1fr);

  gap: 6px;
  margin-bottom: 24px;
}

/* 전체 사진 */

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);

  gap: 6px;
}

.preview img,
.gallery img {
  display: block;

  width: 100%;
  aspect-ratio: 1;

  object-fit: cover;
  border-radius: 9px;

  cursor: pointer;
}

/* ========================================
   설정 항목
======================================== */

.setting-row {
  display: block;

  width: 100%;
  padding: 18px 0;

  border: 0;
  border-bottom: 1px solid #eee;

  background: #fff;
  color: #222;

  font-size: 14px;
  text-align: left;
}

.field {
  display: block;

  width: 100%;
  padding: 13px;

  border: 1px solid #ddd;
  border-radius: 12px;

  outline: none;
  font-size: 15px;
}

.note {
  color: #888;
  font-size: 13px;
  line-height: 1.6;
}

/* ========================================
   대화 검색
======================================== */

.search-result {
  display: block;

  width: 100%;
  padding: 13px 0;

  border: 0;
  border-bottom: 1px solid #eee;

  background: #fff;
  text-align: left;
}

.search-date {
  margin-bottom: 5px;

  color: #999;
  font-size: 12px;
}

.search-text {
  font-size: 14px;
  line-height: 1.5;

  white-space: pre-wrap;
  overflow-wrap: break-word;
}

/* 검색한 말풍선 강조 */

.highlight {
  animation: flash 2s ease-out;
}

@keyframes flash {
  0%,
  40% {
    background: #ffe3a0;
  }

  100% {
    background: #fff;
  }
}

/* ========================================
   사진 확대
======================================== */

.viewer {
  display: none;

  position: fixed;
  inset: 0;
  z-index: 100;

  align-items: center;
  justify-content: center;
  flex-direction: column;

  gap: 16px;
  padding: 20px;

  background: rgba(0, 0, 0, 0.92);
}

.viewer.open {
  display: flex;
}

.viewer img {
  max-width: 100%;
  max-height: 80dvh;

  object-fit: contain;
}

.viewer button {
  padding: 10px 20px;

  border: 0;
  border-radius: 20px;

  background: #fff;
  color: #222;
}

/* ========================================
   작은 모바일 화면
======================================== */

@media (max-width: 360px) {

  .chat {
    padding-left: 10px;
    padding-right: 10px;
  }

  .message {
    gap: 7px;
  }

  .profile {
    width: 36px;
    height: 36px;
    flex-basis: 36px;
  }

  .bubble {
    padding: 10px 12px;
    font-size: 14px;
  }

  .reply {
    padding: 12px 14px;
  }

  .reply-answer {
    font-size: 14px;
  }
}


/* ========================================
   휴대폰 화면 크기 보정
   PC 화면은 변경하지 않음
======================================== */

@media screen and (max-width: 600px) {

  .header {
    height: 52px;
  }

  .header-title {
    font-size: 14px;
  }

  .header-days {
    font-size: 10px;
  }

  .chat {
    padding-left: 12px;
    padding-right: 12px;
  }

  .message {
    gap: 8px;
    margin-bottom: 20px;
  }

  .profile {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
  }

  .meta {
    min-height: 18px;
    margin-bottom: 6px;
  }

  .sender {
    font-size: 12px;
  }

  .time {
    font-size: 10px;
    margin-left: 5px;
  }

  .badge,
  .badge svg {
    width: 15px;
    height: 15px;
  }

  /* 일반 말풍선 */

  .bubble {
    width: fit-content;
    max-width: 100%;
    padding: 9px 12px;
    border-radius: 20px;
    font-size: 12px;
    line-height: 1.5;
  }

  /* 답장 말풍선 */

  .reply {
    display: table;
    width: fit-content;
    max-width: 100%;
    padding: 11px 13px;
    border-radius: 23px;
  }

  .reply-heading {
    font-size: 11px;
    line-height: 1.4;
  }

  .reply-quote {
    margin-top: 4px;
    font-size: 10px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-wrap: anywhere;
  }

  .reply-main {
    gap: 7px;
    margin-top: 10px;
  }

  .reply-arrow,
  .reply-arrow svg {
    width: 18px;
    height: 18px;
  }

  .reply-arrow {
    flex: 0 0 18px;
  }

  .reply-answer {
    font-size: 12px;
    line-height: 1.45;
  }

  /* 사진 크기 */

  .message-photo {
    max-width: min(100%, 270px);
  }

  /* 날짜 표시 */

  .day-label {
    font-size: 11px;
    padding: 6px 13px;
  }

}


</style>



</head>

<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-back" viewBox="0 0 24 24">
    <path d="M15 4L7 12L15 20"/>
  </symbol>

  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="10.8" cy="10.8" r="6.8"/>
    <path d="m16 16 5 5"/>
  </symbol>

  <symbol id="i-calendar" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="16" rx="2"/>
    <path d="M7 2v6M17 2v6M3 10h18"/>
  </symbol>



<symbol id="i-lang" viewBox="0 0 24 24">
  <g transform="translate(-1.5 -1.5) scale(1.13)">
    <!-- 뒤쪽 A 네모 -->
    <rect x="2.5" y="2.5" width="13" height="13"
          rx="2.2" fill="none" />
    <path d="M5.5 12L9 5.5L12.5 12
             M6.8 9.5H11.2"
          fill="none" />

    <!-- 앞쪽 번역 네모 -->
    <rect x="10" y="10" width="11.5" height="11.5"
          rx="2.2" fill="none" />
    <path d="M12.5 14H19
             M15.8 12.5V14
             M13.2 14.5C14.2 17 16 18.8 18.8 19.5
             M18.5 14.5C17.5 17 15.5 18.5 13.5 19.5"
          fill="none" />
  </g>
</symbol>



</svg>

<div class="app">

  <header class="header">
    <button id="settingsBtn" class="icon-btn" aria-label="설정">
      <svg><use href="#i-back"/></svg>
    </button>

    <div class="header-center">
      <div class="header-title">Delight</div>
      <div class="header-days" id="days"></div>
    </div>

    <div class="header-actions">
      <button id="translateBtn" class="icon-btn" aria-label="번역">
        <svg><use href="#i-lang"/></svg>
      </button>

      <button id="searchBtn" class="icon-btn" aria-label="검색">
        <svg><use href="#i-search"/></svg>
      </button>

      <button id="calendarBtn" class="icon-btn" aria-label="달력">
        <svg><use href="#i-calendar"/></svg>
      </button>
    </div>
  </header>

  <div id="langMenu" class="lang-menu">
    <button data-lang="original" class="active">원문</button>
    <button data-lang="en">English</button>
    <button data-lang="ja">日本語</button>
    <button data-lang="zh-CN">中文(简体)</button>
    <button data-lang="zh-TW">中文(繁體)</button>
  </div>

  <div id="calendar" class="calendar">
    <div class="calendar-head">
      <button id="prevMonth">‹</button>
      <strong id="calendarTitle"></strong>
      <button id="nextMonth">›</button>
    </div>

    <div id="calendarGrid" class="calendar-grid"></div>

    <button id="latestBtn" class="primary">
      마지막 팝으로
    </button>
  </div>

  <main id="chat" class="chat">
    <div class="notice">
      <strong id="welcome">방문자님 환영해요!</strong>
      <div>
        상대방을 불쾌하게 하는 욕설 및 비하 표현을 삼가고 배려하며 소통해 주세요.
      </div>
    </div>

    <div id="messageList"></div>
  </main>

</div>

<div id="overlay" class="overlay">
  <div class="sheet">
    <div class="handle"></div>
    <button id="closeSheet" class="close">×</button>
    <div id="sheetTitle" class="sheet-title">설정</div>
    <div id="sheetContent"></div>
  </div>
</div>

<div id="viewer" class="viewer">
  <img id="viewerImage" alt="POP 사진 확대">
  <button id="closeViewer">닫기</button>
</div>

<script>
"use strict";

/* ==========================================
   날짜별 POP 기록

   12월 17일 → 18일 → 19일
========================================== */

const recordsByDate = [

  /* ========================================
     2025년 12월 17일
  ======================================== */

  {
    date: "2025-12-17",
    messages: [

/* 요소 생성 */

function el(tag, className, text) {
  const element = document.createElement(tag);

  if (className) {
    element.className = className;
  }

  if (text !== undefined) {
    element.textContent = text;
  }

  return element;
}

/* 날짜 */

function fullDateLabel(dateString) {
  const [year, monthNumber, day] =
    dateString.split("-").map(Number);

  const date = new Date(year, monthNumber - 1, day);

  const weekdays = [
    "일", "월", "화", "수", "목", "금", "토"
  ];

  return (
    year + "년 " +
    monthNumber + "월 " +
    day + "일 " +
    weekdays[date.getDay()] + "요일"
  );
}

/* 시간 */

function timeLabel(time) {
  const [hour, minute] = time.split(":").map(Number);

  return (
    (hour < 12 ? "오전" : "오후") +
    " " +
    (hour % 12 || 12) +
    ":" +
    String(minute).padStart(2, "0")
  );
}

/* 함께한 지 N일 */

function updateDays() {
  const now = new Date();

  const start = Date.UTC(2025, 11, 17);

  const today = Date.UTC(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  const days = Math.max(
    0,
    Math.round((today - start) / 86400000) + 1
  );

  $("days").textContent = "함께한 지 " + days + "일";
}

/* 닉네임 */

function updateNickname() {
  const name = (
    localStorage.getItem("delightNickname") || "방문자"
  ).trim();

  const displayName = name.endsWith("님")
    ? name
    : name + "님";

  $("welcome").textContent =
    displayName + " 환영해요!";
}

/* 번역 요소 */

function translatedPart(text) {
  const div = el("div", "translation");

  /* 화면에서 강제 줄바꿈된 원문도 번역 검색 가능 */
  div.dataset.translate = text.replace(/\n/g, "");

  return div;
}

/* 일반 말풍선 */

function makeText(text, id) {
  const bubble = el("div", "bubble");

  bubble.id = id;

  bubble.append(
    el("div", "original", text),
    translatedPart(text)
  );

  return bubble;
}

/* 답장 말풍선 */

function makeReply(item, id) {
  const reply = el("div", "reply");

  reply.id = id;

  const main = el("div", "reply-main");
  const content = el("div", "reply-answer-content");
  const arrow = el("span", "reply-arrow");

  arrow.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none">
      <path
        d="M5 3V12C5 15 7 17 10 17H19M15 13L19 17L15 21"
        stroke="currentColor"
        stroke-width="2.1"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>
  `;

  content.append(
    el("div", "reply-answer", item.text),
    translatedPart(item.text)
  );

  main.append(arrow, content);

  reply.append(
    el("div", "reply-heading", "Delight님의 답장"),
    el("div", "reply-quote", item.quoted),
    translatedPart(item.quoted),
    main
  );

  return reply;
}

/* 사진 */

function makeImage(item) {
  const img = el("img", "message-photo");

  img.src = item.src;
  img.alt = "POP 사진";
  img.loading = "lazy";

  img.onclick = () => openImage(item.src);

  /* 없는 파일은 회색 오류 박스 없이 숨김 */
  img.onerror = () => img.remove();

  return img;
}

/* 전체 메시지 렌더링 */

function render() {
  list.replaceChildren();

  recordsByDate.forEach(day => {
    const dateLabel = el(
      "div",
      "day-label",
      fullDateLabel(day.date)
    );

    dateLabel.id = "date-" + day.date;

    list.append(dateLabel);

    day.messages.forEach(([time, items], index) => {
      const row = el("div", "message");
      const profile = el("img", "profile");
      const body = el("div", "message-content");
      const meta = el("div", "meta");
      const badge = el("span", "badge");

      profile.src = "profile.jpg";
      profile.alt = "Delight";

      badge.innerHTML = badgeSVG;

      meta.append(
        el("span", "sender", "Delight"),
        badge,
        el("span", "time", timeLabel(time))
      );

      body.append(meta);

      items.forEach((item, itemIndex) => {
        const id =
          "msg-" + day.date + "-" + index + "-" + itemIndex;

        if (typeof item === "string") {
          body.append(makeText(item, id));

        } else if (item.type === "reply") {
          body.append(makeReply(item, id));

        } else if (item.type === "image") {
          body.append(makeImage(item));
        }
      });

      row.append(profile, body);
      list.append(row);
    });
  });

  applyLanguage(language);
}

/* 즉시 번역 */

function applyLanguage(lang) {
  language = lang;

  menu.classList.remove("open");

  document.querySelectorAll(
    ".lang-menu button"
  ).forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.lang === lang
    );
  });

  document.querySelectorAll(
    "[data-translate]"
  ).forEach(target => {
    const original = target.dataset.translate;

    const result = lang === "original"
      ? ""
      : (translations[original]?.[lang] || "");

    target.textContent = result;

    target.classList.toggle(
      "show",
      lang !== "original" && !!result
    );
  });
}

/* 설정창 */

function openSheet(title, html) {
  cal.classList.remove("open");
  menu.classList.remove("open");

  $("sheetTitle").textContent = title;
  $("sheetContent").innerHTML = html;

  overlay.classList.add("open");
}

function closeSheet() {
  overlay.classList.remove("open");
}

/* 사진 자동 수집 */

function photoList() {
  const photos = [];

  recordsByDate.forEach(day => {
    day.messages.forEach(([time, items]) => {
      items.forEach(item => {
        if (
          item &&
          typeof item === "object" &&
          item.type === "image"
        ) {
          photos.push({
            date: day.date,
            time,
            src: item.src
          });
        }
      });
    });
  });

  return photos;
}

/* 사진 확대 */

function openImage(src) {
  $("viewerImage").src = src;
  $("viewer").classList.add("open");
}

/* 썸네일 */

function thumbnail(place, item) {
  const img = el("img");

  img.src = item.src;
  img.alt = "POP 사진";
  img.loading = "lazy";

  img.onclick = () => openImage(item.src);
  img.onerror = () => img.remove();

  place.append(img);
}

/* 닉네임 설정 */

function openNickname(first = false) {
  openSheet(
    first ? "닉네임 설정" : "닉네임 변경",
    `
      <p class="note">
        POP에서 사용하실 닉네임을 입력해 주세요.
      </p>

      <input
        id="nicknameInput"
        class="field"
        maxlength="20"
        placeholder="닉네임 입력">

      <button id="saveName" class="primary">
        저장하기
      </button>
    `
  );

  const input = $("nicknameInput");

  input.value =
    localStorage.getItem("delightNickname") || "";

  const save = () => {
    const name = input.value.trim();

    if (!name) {
      alert("닉네임을 입력해 주세요.");
      return;
    }

    localStorage.setItem("delightNickname", name);

    updateNickname();
    closeSheet();
  };

  $("saveName").onclick = save;

  input.onkeydown = event => {
    if (event.key === "Enter") {
      save();
    }
  };
}

/* 메시지 검색 */

function openSearch() {
  openSheet("대화 검색", `
    <input
      id="searchInput"
      class="field"
      placeholder="검색할 단어를 입력하세요">

    <p id="searchCount" class="note"></p>

    <div id="searchResults"></div>
  `);

  $("searchInput").oninput = () => {
    const query = $("searchInput")
      .value.trim()
      .toLocaleLowerCase();

    const results = $("searchResults");

    results.replaceChildren();

    if (!query) {
      $("searchCount").textContent = "";
      return;
    }

    const matches = [];

    recordsByDate.forEach(day => {
      day.messages.forEach(([time, items], i) => {
        items.forEach((item, j) => {
          let text = "";

          if (typeof item === "string") {
            text = item;

          } else if (item.type === "reply") {
            text = item.quoted + " " + item.text;
          }

          if (
            text.toLocaleLowerCase().includes(query)
          ) {
            matches.push({
              date: day.date,
              time,
              text,
              id: `msg-${day.date}-${i}-${j}`
            });
          }
        });
      });
    });

    $("searchCount").textContent =
      matches.length + "건";

    matches.reverse().forEach(hit => {
      const button = el("button", "search-result");

      button.append(
        el(
          "div",
          "search-date",
          fullDateLabel(hit.date) + " " + timeLabel(hit.time)
        ),
        el("div", "search-text", hit.text)
      );

      button.onclick = () => {
        closeSheet();

        const target = $(hit.id);

        if (!target) return;

        const top =
          target.getBoundingClientRect().top -
          chat.getBoundingClientRect().top +
          chat.scrollTop - 65;

        chat.scrollTo({
          top,
          behavior: "smooth"
        });

        target.classList.remove("highlight");

        void target.offsetWidth;

        target.classList.add("highlight");
      };

      results.append(button);
    });
  };
}

/* 달력 */

function drawCalendar() {
  const year = month.getFullYear();
  const monthNumber = month.getMonth();

  const grid = $("calendarGrid");

  $("calendarTitle").textContent =
    year + "년 " + (monthNumber + 1) + "월";

  grid.replaceChildren();

  const weekdays = [
    "일", "월", "화", "수", "목", "금", "토"
  ];

  weekdays.forEach(day => {
    grid.append(el("div", "weekday", day));
  });

  const firstDay =
    new Date(year, monthNumber, 1).getDay();

  for (let i = 0; i < firstDay; i++) {
    grid.append(el("div"));
  }

  const activeDates = new Set(
    recordsByDate.map(day => day.date)
  );

  const totalDays =
    new Date(year, monthNumber + 1, 0).getDate();

  for (let day = 1; day <= totalDays; day++) {
    const button = el("button", "day", String(day));

    const dateString =
      year + "-" +
      String(monthNumber + 1).padStart(2, "0") + "-" +
      String(day).padStart(2, "0");

    if (activeDates.has(dateString)) {
      button.classList.add("has");
    }

    button.onclick = () => {
      cal.classList.remove("open");

      if (activeDates.has(dateString)) {
        const target = $("date-" + dateString);

        if (target) {
          const top =
            target.getBoundingClientRect().top -
            chat.getBoundingClientRect().top +
            chat.scrollTop - 16;

          chat.scrollTo({
            top,
            behavior: "smooth"
          });
        }

      } else {
        alert("해당 날짜에 등록된 메시지가 없습니다.");
      }
    };

    grid.append(button);
  }
}

/* 버튼 연결 */

$("settingsBtn").onclick = openSettings;

$("searchBtn").onclick = openSearch;

$("translateBtn").onclick = () => {
  cal.classList.remove("open");
  menu.classList.toggle("open");
};

document.querySelectorAll(
  ".lang-menu button"
).forEach(button => {
  button.onclick = () => {
    applyLanguage(button.dataset.lang);
  };
});

$("calendarBtn").onclick = () => {
  menu.classList.remove("open");
  cal.classList.toggle("open");
  drawCalendar();
};

$("prevMonth").onclick = () => {
  month = new Date(
    month.getFullYear(),
    month.getMonth() - 1,
    1
  );

  drawCalendar();
};

$("nextMonth").onclick = () => {
  month = new Date(
    month.getFullYear(),
    month.getMonth() + 1,
    1
  );

  drawCalendar();
};

$("latestBtn").onclick = () => {
  cal.classList.remove("open");

  chat.scrollTo({
    top: chat.scrollHeight,
    behavior: "smooth"
  });
};

$("closeSheet").onclick = closeSheet;

overlay.onclick = event => {
  if (event.target === overlay) {
    closeSheet();
  }
};

$("closeViewer").onclick = () => {
  $("viewer").classList.remove("open");
};

document.addEventListener("click", event => {
  if (
    !event.target.closest("#translateBtn") &&
    !event.target.closest("#langMenu")
  ) {
    menu.classList.remove("open");
  }

  if (
    !event.target.closest("#calendarBtn") &&
    !event.target.closest("#calendar")
  ) {
    cal.classList.remove("open");
  }
});

document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      updateDays();
    }
  }
);
/* ==========================================
   POP 원본 줄바꿈 보정
   2025년 12월 17일 ~ 20일

   기존 메시지와 번역 데이터 유지
========================================== */

function fixOriginalLineBreaks() {

  /* 날짜와 시간을 기준으로 메시지 찾기 */

  function findMessages(date, time) {
    const day = recordsByDate.find(
      record => record.date === date
    );

    if (!day) return null;

    const message = day.messages.find(
      record => record[0] === time
    );

    return message ? message[1] : null;
  }

  /* 일반 말풍선 줄바꿈 */

  function fixText(date, time, original, corrected) {
    const items = findMessages(date, time);

    if (!items) return;

    const index = items.findIndex(
      item =>
        typeof item === "string" &&
        item.replace(/\n/g, "") === original
    );

    if (index !== -1) {
      items[index] = corrected;
    }
  }

  /* 답장 인용문 줄바꿈 */

  function fixReply(date, time, original, corrected) {
    const items = findMessages(date, time);

    if (!items) return;

    const reply = items.find(
      item =>
        item &&
        typeof item === "object" &&
        item.type === "reply" &&
        item.quoted.replace(/\n/g, "") === original
    );

    if (reply) {
      reply.quoted = corrected;
    }
  }

  /* ========================================
     12월 17일
  ======================================== */

  /* 오후 3:23 */

  fixText(
    "2025-12-17",
    "15:23",
    "말은 알아서들 하고 메뉴도 알아서들 먹죠 추천대로 안 먹잖슴",
    "말은 알아서들 하고 메뉴도 알아서들 먹죠 추천대\n로 안 먹잖슴"
  );

  /* 오후 9:18 */

  fixReply(
    "2025-12-17",
    "21:18",
    "그거 결국 건우처럼 사람 진짜 팔것같이 생긴애들 나왔지만 건우처럼 알고보면 착한애들만 나옴",
    "그거 결국 건우처럼 사람 진짜 팔것같이 생긴애들 나왔지만 건우처럼 알고보면 \n착한애들만 나옴"
  );

  /* ========================================
     12월 18일
  ======================================== */

  /* 오후 2:05 */

  fixText(
    "2025-12-18",
    "14:05",
    "나는 사람은 보상 심리가 있어서 꼭 유튜브 보거나 웹툰 봐야해",
    "나는 사람은 보상 심리가 있어서 꼭 유튜브 보거\n나 웹툰 봐야해"
  );

  /* 오후 2:16 */

  fixReply(
    "2025-12-18",
    "14:16",
    "책은 안 읽어? 그런 꿈 이야기 재밌는거 달러구트 꿈 백화점 읽어봐",
    "책은 안 읽어? 그런 꿈 이야기 재밌는거 달러구트 꿈 백화점 읽어\n봐"
  );

  /* 오후 2:48 */

  fixText(
    "2025-12-18",
    "14:48",
    "난 10시에 먹는 야식 무조건 먹어야 하는 줄 알았지",
    "난 10시에 먹는 야식 무조건 먹어야 하는 줄 알았\n지"
  );

  /* ========================================
     12월 19일
  ======================================== */

  /* 오후 7:42 */

  fixText(
    "2025-12-19",
    "19:42",
    "한 4년 전 꿈에서 운전했을 때 진짜 실감 나게 잘 했는데",
    "한 4년 전 꿈에서 운전했을 때 진짜 실감 나게 잘\n했는데"
  );

  /* 오후 7:50 */

  fixText(
    "2025-12-19",
    "19:50",
    "강아지는 덩치 더 큰 애가 소금이고 작은 애가 봄이요",
    "강아지는 덩치 더 큰 애가 소금이고 작은 애가 봄\n이요"
  );

}

/* 줄바꿈 수정 실행 */
